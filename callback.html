<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Catnibee Uploader · Login complete</title>
<style>
  body { margin: 0; font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; background: #fdf8f0; color: #3a4658; line-height: 1.7; }
  main { max-width: 640px; margin: 0 auto; padding: 56px 20px; }
  code { display: block; word-break: break-all; background: #fff; border: 1px solid #e3d9c8; border-radius: 8px; padding: 14px; font-size: 0.95rem; }
  button { margin-top: 12px; padding: 10px 18px; border: 0; border-radius: 8px; background: #3a4658; color: #fff; font-size: 1rem; cursor: pointer; }
  .err { color: #b04040; }
</style>
</head>
<body>
<main>
  <h1>Catnibee Uploader</h1>
  <div id="out"></div>
  <p><a href="index.html">← Catnibee</a></p>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const out = document.getElementById("out");
  const code = q.get("code");
  const err = q.get("error") || q.get("error_description");
  if (code) {
    out.innerHTML = '<p>Login complete. Copy this code and paste it into the uploader within a few minutes.</p>' +
      '<p>로그인 완료. 아래 코드를 복사해서 몇 분 안에 업로더에 붙여넣으세요.</p><code id="c"></code>' +
      '<button id="b">Copy / 복사</button>';
    document.getElementById("c").textContent = code;
    document.getElementById("b").onclick = () => navigator.clipboard.writeText(code).then(() => { document.getElementById("b").textContent = "Copied / 복사됨"; });
  } else if (err) {
    out.innerHTML = '<p class="err"></p>';
    out.querySelector(".err").textContent = "Login failed: " + err;
  } else {
    out.innerHTML = "<p>This page receives the login result for the Catnibee Uploader tool. Nothing to do here.</p>";
  }
</script>
</body>
</html>
